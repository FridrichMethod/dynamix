# Configuration of the code-quality tools (ruff, mypy, coverage.py). This repository is not a Python package: there is
# no [project] table and nothing is installed from it. Tool versions are pinned in requirements-lint.txt,
# .pre-commit-config.yaml and package.json; tests/test_tooling.py keeps them equal and checks the exclusions.

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["scripts", "tests"]
# Python files only: ruff 0.17 also formats Python code blocks in Markdown by default, and the Markdown documents
# (several of them published with the website) are edited by hand.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# Byte-pinned and generated files (.gitattributes -text entries, build outputs) are never linted or formatted, even
# when a hook passes their paths explicitly.
force-exclude = true
extend-exclude = ["assets", "data", "src/vendor", "tests/fixtures"]

[tool.ruff.lint]
# Stage 1: syntax and runtime errors, pyflakes, pycodestyle warnings, import order, bugbear, pyupgrade, pylint errors.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "PLE"]

[tool.ruff.lint.isort]
# Entry scripts put scripts/ on sys.path and import these packages from there.
known-first-party = ["lib", "primary", "wikis"]

[tool.ruff.format]
# ruff's defaults (double quotes, spaces, magic trailing commas) already match the code.

[tool.mypy]
# Stage 1: the shared library only, without strict mode. The staged plan for widening it is in
# docs/implementation/09-frozen-contracts.md ("Tooling contract").
python_version = "3.14"
files = ["scripts/lib"]
mypy_path = "scripts"
explicit_package_bases = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
# Measures scripts/ while the unit tests run, including every script they start as a subprocess (python -I, any cwd).
source = ["scripts"]
branch = true
parallel = true
patch = ["subprocess"]
disable_warnings = ["module-not-imported", "module-not-measured", "no-data-collected"]

[tool.coverage.report]
# The measured baseline, rounded down; raise it when coverage rises, never lower it to pass.
fail_under = 90
precision = 1
skip_empty = true
