    <script>
        // The language toggle rewrites ?lang= with history.replaceState; keep Pace from treating that as a page load.
        window.paceOptions = {restartOnPushState: false};

    <script src="src/vendor/legacy-ui.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/i18n/common.js"></script>
    <script src="src/i18n/slideshow.js"></script>

    <script>
        "use strict";

        var slideIndex = 1;
        var imgTargets = document.getElementsByClassName("dynamix-draw");
        // index.html?asset=<id> (the reference gallery's form) or index.html#<id> opens straight on that slide; ?asset=
        // wins on load only, while a later change of the fragment is read on its own (see the hashchange listener).
        function hashId() {
            try { return decodeURIComponent(location.hash.slice(1)); } catch (err) { return ""; }
        }
        function requestedId() {
            return new URLSearchParams(location.search).get("asset") || hashId();
        }
        function indexOfAsset(id) {
            return id ? Array.from(imgTargets).findIndex(function(img) { return img.dataset.id === id; }) : -1;
        }
        var requestedIndex = indexOfAsset(requestedId());
        var linerText = document.querySelector("[data-slide-text]");
        var slideNotes = linerText.querySelector(".slide-notes");
        var caption = document.querySelector(".asset-caption");
        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        var introShown = true;
        var notesTimer = 0;
        // The title card returns over every fifth automatic turn, then hands over to that slide's notes.
        var INTRO_EVERY = 5;
        var autoTurns = 0;
        // Until the first slide is shown this page title is localized; showSlides() then owns document.title.
        var slideShown = false;
        var hasSlides = imgTargets.length > 0;
        document.title = DYNAMIX_I18N.t("slideshow.title");
        DYNAMIX_I18N.onChange(function() {
            if (slideShown) {
                showCaption();
                showNotes(false);
                setPageTitle();
            } else document.title = DYNAMIX_I18N.t("slideshow.title");
        });
        // An empty show keeps the title card with a pointer to the archive; nothing to turn, nothing to autoplay.
        if (!hasSlides) {
            document.querySelector(".intro-empty").hidden = false;
            caption.hidden = true;
            document.querySelector(".prev").hidden = true;
            document.querySelector(".next").hidden = true;
            document.querySelector(".random button").setAttribute("aria-pressed", "false");
        }
        // A deep link opens straight on that slide's notes; otherwise the page opens on the title card.
        if (requestedIndex >= 0) setIntro(false);

        window.addEventListener('load', function() {
            document.querySelector(".dynamix-view").style.opacity = "1";
            if (!hasSlides) {
                window.clearInterval(int);
                randomFlag = 1;
            } else if (requestedIndex >= 0) {
                slideIndex = requestedIndex + 1;
                showSlides();
                if (randomFlag == 0) randomClick();
            } else if (randomFlag == 0) {
                // Restart the beat so the title card gets a full one before the first hand-over.
                window.clearInterval(int);
                int = self.setInterval(autoplayTick, 6000);
                randomSlide();
            } else if (!slideShown) {
                // Paused (sand clock or arrows) before the page loaded: show a slide, but leave autoplay off.
                randomSlide();
            }
            for (var i = 0; i < document.getElementsByClassName("bt").length; i++) {
                document.getElementsByClassName("bt")[i].style.opacity = "1";
            }
        });

        // A changed #<id> (Back, or a link on the page) turns to that slide and pauses autoplay.
        window.addEventListener("hashchange", function() {
            var index = indexOfAsset(hashId());
            if (index < 0) return;
            slideIndex = index + 1;
            plusSlides(0);
        });

        // Timeout
        var int = self.setInterval(autoplayTick, 6000);

        // Each autoplay beat first hands the title card over to the current slide's notes, then moves on;
        // every fifth turn brings the title card back over the new slide.
        function autoplayTick() {
            // A beat before the page has loaded (and shown its first slide) would spend the opening title card.
            if (!slideShown || !hasSlides) return;
            if (introShown) {
                setIntro(false);
                return;
            }
            autoTurns = (autoTurns + 1) % INTRO_EVERY;
            if (!autoTurns) setIntro(true);
            randomSlide();
        }

        function plusSlides(n) {
            if (!hasSlides) return;
            showSlides(slideIndex += n);
            setIntro(false);
            try {
                int = window.clearInterval(int);
                showAutoplay(false);
                randomFlag = 1;
            } catch (err) {}
        }

        function setPageTitle() {
            document.title = slideIndex + "/" + imgTargets.length + " | " + DYNAMIX_I18N.t("slideshow.title.short");
        }

        function showSlides() {
            if (!hasSlides) return;
            var i;
            var slides = document.getElementsByClassName("mySlides");
            // control
            if (slideIndex <= 0) {
                slideIndex = imgTargets.length;
            } else if (slideIndex > imgTargets.length) {
                slideIndex = 1;
            }
            setPageTitle();
            // The caption always describes the current slide; the first slide's notes are in place at once, later
            // ones turn with the artwork.
            showCaption();
            showNotes(slideShown);
            slideShown = true;
            // load
            lazyload(slideIndex - 1);
            // hide (see .is-current in src/slideshow.css)
            for (i = 0; i < slides.length; i++) {
                slides[i].style.opacity = 0;
                slides[i].classList.remove("is-current");
            }
            // check load condition
            var displayedIndex = slideIndex - 1;
            imgLoad(displayedIndex, function() {
                // display
                if (slideIndex - 1 === displayedIndex) {
                    slides[displayedIndex].style.opacity = 1;
                    slides[displayedIndex].classList.add("is-current");
                }
            });
        }

        // Only absolute http(s) URLs become links; anything else leaves the link without a target.
        function httpHref(value) {
            try {
                var url = new URL(value || "");
                return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
            } catch (err) { return ""; }
        }

        // A slide's own file: a site-relative path, never a scheme, a leading slash, a space or a control character
        // (scripts/render_slideshow.py writes only such paths; this is the page's own guard).
        function localHref(value) {
            return typeof value === "string" && value && !/[\u0000-\u0020\u007f]/.test(value) && !/^([a-z][a-z\d+.-]*:|[\\/])/i.test(value) ? value : "";
        }

        function setHref(node, href) {
            if (href) node.setAttribute("href", href);
            else node.removeAttribute("href");
        }

        // caption (re-run on language change; source names from the data stay verbatim unless a table localizes them)
        function showCaption() {
            var target = imgTargets[slideIndex - 1];
            if (!target) return;
            var data = target.dataset;
            document.getElementById("asset-title").textContent = data.title;
            document.getElementById("asset-size").textContent = data.size;
            var source = document.getElementById("asset-source");
            source.textContent = DYNAMIX_I18N.sourceName(data.sourceId, data.source);
            setHref(source, httpHref(data.page));
            // The original link downloads the file this site serves; for a slide shown from its preview (an original
            // kept only in the repository) it opens the repository copy in a new tab instead.
            var original = document.getElementById("asset-original");
            if (data.originalExternal === "true") {
                setHref(original, httpHref(data.original));
                original.removeAttribute("download");
                original.target = "_blank";
                original.rel = "noopener noreferrer";
            } else {
                setHref(original, localHref(data.original || data.src));
                original.setAttribute("download", "");
                original.removeAttribute("target");
                original.removeAttribute("rel");
            }
            // A copy that is not the artist's or the publisher's own (a wiki copy, a repost, a scan) is named as such
            // after its source, even where the notes' eyebrow is hidden (the smallest screens, the title card).
            var origin = document.getElementById("asset-origin");
            var token = data.origin || "";
            origin.replaceChildren();
            if (/^(wiki_copy|repost|scan)$/.test(token) && DYNAMIX_I18N.has("quality.origin_status." + token)) {
                var label = element("span", null, DYNAMIX_I18N.t("quality.origin_status." + token));
                label.style.whiteSpace = "nowrap";
                origin.append("\u00a0· ", label);
            }
        }

        // While the notes are up the caption leaves out the title they already show (see src/slideshow.css).
        function setIntro(show) {
            introShown = show;
            if (show) autoTurns = 0;
            // Notes still waiting to change under the title card change now, before they fade back in.
            else if (notesTimer && !slideNotes.classList.contains("is-turning")) renderNotes();
            linerText.classList.toggle("is-intro", show);
        }

        function element(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        // A row of the notes, one value per line, classed by its role: notes-composer, notes-artist (the illustrator's
        // credit, the row that stays where short screens drop the others; see src/slideshow.css) or notes-collection.
        // With no value the row says "Unknown" when `always` is set.
        function metaRow(list, role, label, value, always) {
            if (!value && !always) return;
            var dt = element("dt", "notes-" + role, label);
            var dd = element("dd", "notes-" + role);
            if (value) {
                value.split("\n").forEach(function(line, i) {
                    if (i) dd.append(document.createElement("br"));
                    dd.append(line);
                });
            } else {
                dd.textContent = DYNAMIX_I18N.t("credit.unknown");
                dd.classList.add("notes-unknown");
            }
            list.append(dt, dd);
        }

        // A title that is only a file name ("Song_Name_jacket", "Cover01") stays verbatim but is set as a quiet file
        // reference rather than as the headline (see src/slideshow.css).
        function isFileName(title) {
            var words = title.split(" ");
            return /_/.test(title)
                || (/^[A-Za-z0-9 ]+$/.test(title)
                    && words.some(function(word) { return /[A-Za-z]/.test(word) && /\d/.test(word); })
                    && words.slice(1).every(function(word) { return word === word.toLowerCase(); }));
        }

        // Liner notes from the slide's data-* attributes: names stay verbatim, only labels are translated.
        function notesFor(target) {
            var data = target.dataset;
            var notes = document.createDocumentFragment();
            var eyebrow = element("p", "notes-eyebrow");
            var kind = DYNAMIX_I18N.has("kind." + data.kind) ? DYNAMIX_I18N.t("kind." + data.kind) : "";
            // The kind is qualified by where the credited copy comes from (data-origin: the artist's post, an official
            // release, a wiki copy, ...); an unknown origin adds nothing.
            var origin = data.origin && data.origin !== "unknown" && DYNAMIX_I18N.has("quality.origin_status." + data.origin)
                ? DYNAMIX_I18N.t("quality.origin_status." + data.origin) : "";
            if (kind || origin) {
                var label = element("span", "notes-kind", kind);
                if (origin) label.append(element("span", "notes-provenance", (kind ? "\u00a0· " : "") + origin));
                eyebrow.append(label);
            }
            eyebrow.append(element("span", "notes-count", slideIndex + " / " + imgTargets.length));
            // A wiki title that names none of the slide's linked songs (data-songs) is only the file's name: the songs
            // are the headline and the name follows as a quiet file reference. A title names a song when the two are the
            // same ignoring case, accents, spacing and punctuation, or when the words of either run whole inside the
            // other's ("Song" for "Song (Extended)").
            var songs = data.songs ? data.songs.split("\n") : [];
            var words = function(text) { return text.normalize("NFKD").toLowerCase().split(/[^\p{L}\p{N}\p{M}]+/u).map(function(word) { return word.replace(/\p{M}/gu, ""); }).filter(Boolean); };
            var runsWithin = function(part, whole) {
                for (var start = 0; part.length && start + part.length <= whole.length; start++) {
                    if (part.every(function(word, i) { return word === whole[start + i]; })) return true;
                }
                return false;
            };
            var titleWords = words(data.title);
            var file = isFileName(data.title);
            var named = songs.some(function(song) {
                if (file) return song.toLowerCase() === data.title.toLowerCase();
                var songWords = words(song);
                return Boolean(songWords.length && titleWords.length) && (songWords.join("") === titleWords.join("")
                    || runsWithin(songWords, titleWords) || runsWithin(titleWords, songWords));
            });
            var fileKey = songs.length && !named && /^wikis:/.test(data.sourceId || "") ? data.title : "";
            var headline = fileKey ? songs.join(" / ") : data.title;
            // A wrapping title breaks after its last spaced dash, never before a dash or a trailing number: each side of
            // that dash is kept whole where it fits (see src/slideshow.css).
            var title = element("p", "notes-title");
            title.dataset.full = headline;
            var glued = headline.replace(/ — /g, "\u00a0— ").replace(/ (\d+)$/, "\u00a0$1");
            var dash = glued.lastIndexOf("\u00a0— ");
            if (dash > 0) title.append(element("span", "notes-title-part", glued.slice(0, dash + 2)), " ", element("span", "notes-title-part", glued.slice(dash + 3)));
            else title.textContent = glued;
            // CJK characters count double, so long titles step down a size before they wrap into many lines.
            var weight = Array.from(headline).reduce(function(sum, char) {
                return sum + (/[\u1100-\u11ff\u2e80-\ua4cf\uac00-\ud7af\uf900-\ufaff\uff00-\uffef]/.test(char) ? 2 : 1);
            }, 0);
            if (file && !named && !fileKey) title.dataset.length = "file";
            else if (weight > 30) title.dataset.length = "longer";
            else if (weight > 18) title.dataset.length = "long";
            var meta = element("dl", "notes-meta");
            // Separate roles: the composer row appears for song-related art (and says "Unknown" when no one is
            // credited); the illustrator row is always there, so no layout shows an artwork without its credit line.
            metaRow(meta, "composer", DYNAMIX_I18N.t("credit.composer"), data.composers, Boolean(songs.length || data.kind === "song_art"));
            metaRow(meta, "artist", DYNAMIX_I18N.t("credit.illustrator"), data.illustrators, true);
            if (data.collections) {
                metaRow(meta, "collection", data.collections.indexOf("\n") >= 0 ? DYNAMIX_I18N.t("slideshow.notes.collections") : DYNAMIX_I18N.t("slideshow.notes.collection"), data.collections, false);
            }
            notes.append(eyebrow, title);
            if (fileKey) {
                var reference = element("p", "notes-title", fileKey);
                reference.dataset.length = "file";
                reference.dataset.full = fileKey;
                notes.append(reference);
            }
            if (meta.childElementCount) notes.append(meta);
            return notes;
        }

        // Whether a line clamp (see src/slideshow.css) cuts this title or file reference. Glyphs that merely overhang the
        // tight title lines are not a cut: a cut hides at least half a line. `view` is the window the node lives in.
        function isCut(node, view) {
            var style = (view || window).getComputedStyle(node);
            var clamped = (style.webkitLineClamp || "none") !== "none";
            return clamped && node.scrollHeight - node.clientHeight > parseFloat(style.lineHeight) / 2;
        }

        // Short screens cut a long title or file reference with an ellipsis; the page keeps all of it (for screen
        // readers too), and a cut one shows its full wording in a tooltip.
        function markClipped() {
            slideNotes.querySelectorAll("[data-full]").forEach(function(node) {
                if (isCut(node)) node.title = node.dataset.full;
                else node.removeAttribute("title");
            });
        }

        // Notes that would reach the bottom control row (or push the caption under it) give up their least needed parts
        // in turn until they clear it: the packs row, the composer's row, a file reference's extra lines, the title's
        // second line, then the eyebrow (see src/slideshow.css; the archive viewer shows them all). The illustrator's
        // credit is never cut or dropped. The notes are measured as laid out, not as they move while turning.
        var FIT_STEPS = ["collection", "composer", "reference", "title", "eyebrow"];
        var ROW_GAP = 4;
        var controlRow = document.querySelectorAll(".photo, .github, .archive-link, .random");

        function reachesRow() {
            var boxes = [];
            var view = slideNotes.offsetParent;
            if (view) {
                var origin = view.getBoundingClientRect();
                var top = origin.top + slideNotes.offsetTop, left = origin.left + slideNotes.offsetLeft;
                boxes.push({top: top, bottom: top + slideNotes.offsetHeight, left: left, right: left + slideNotes.offsetWidth});
            }
            Array.prototype.forEach.call(caption.children, function(line) {
                if (line.getClientRects().length) boxes.push(line.getBoundingClientRect());
            });
            var discs = Array.prototype.map.call(controlRow, function(disc) { return disc.getBoundingClientRect(); });
            return boxes.some(function(box) {
                return discs.some(function(disc) {
                    return box.left < disc.right && box.right > disc.left && box.top < disc.bottom && box.bottom > disc.top - ROW_GAP;
                });
            });
        }

        function fitNotes() {
            var steps = [];
            slideNotes.removeAttribute("data-fit");
            for (var i = 0; i < FIT_STEPS.length && reachesRow(); i++) {
                steps.push(FIT_STEPS[i]);
                slideNotes.setAttribute("data-fit", steps.join(" "));
            }
            markClipped();
        }
        window.addEventListener("resize", fitNotes);

        function renderNotes() {
            window.clearTimeout(notesTimer);
            notesTimer = 0;
            slideNotes.classList.remove("is-turning");
            caption.classList.remove("is-turning");
            slideNotes.replaceChildren(notesFor(imgTargets[slideIndex - 1]));
            fitNotes();
        }

        // Visible notes dip out, change and fade back in with the artwork; notes giving way to the title card change
        // once they have faded out under it. The caption already shows the new slide's fine print, so it stays hidden
        // until the notes change and then fades back in with them, never ahead of the notes.
        function showNotes(animate) {
            if (!imgTargets[slideIndex - 1]) return;
            window.clearTimeout(notesTimer);
            if (!animate || reducedMotion.matches) {
                renderNotes();
                return;
            }
            if (!introShown) slideNotes.classList.add("is-turning");
            caption.classList.add("is-turning");
            notesTimer = window.setTimeout(renderNotes, introShown ? 420 : 260);
        }

        // check picture load condition; a slide whose file fails still turns (its notes and caption stay readable).
        function imgLoad(n, callback) {
            var img = imgTargets[n];
            if (!img) return;
            if (img.complete && img.getAttribute("src")) callback(img);
            else {
                img.addEventListener("load", function() { callback(img); }, {once: true});
                img.addEventListener("error", function() { callback(img); }, {once: true});
            }
        }

        function lazyload(n) {
            // The stage fits every artwork's visible part to the same visual area (it needs that part's aspect ratio and
            // its square root), but never beyond twice its natural width, so small pieces stay crisp. The visible part
            // is the whole image, or for a cut-out on a transparent canvas its opaque box (data-art-box: "x y w h" as
            // fractions of the canvas); the image is then enlarged by 1 / w and shifted to centre that box.
            var img = imgTargets[n];
            if (!img) return;
            var size = (img.dataset.size || "").match(/\d+/g) || [1, 1];
            var box = (img.dataset.artBox || "0 0 1 1").split(" ").map(Number);
            var width = size[0] * box[2];
            var ratio = width / (size[1] * box[3]);
            img.style.setProperty("--ratio", ratio);
            img.style.setProperty("--root", Math.sqrt(ratio));
            img.style.setProperty("--natural-width", width + "px");
            img.style.setProperty("--canvas-ratio", size[0] / size[1]);
            img.style.setProperty("--box-width", box[2]);
            img.style.setProperty("--box-height", box[3]);
            img.style.setProperty("--shift-x", .5 - box[0] - box[2] / 2);
            img.style.setProperty("--shift-y", .5 - box[1] - box[3] / 2);
            if (img.getAttribute("src") !== img.getAttribute("data-src")) img.setAttribute("src", img.getAttribute("data-src"));
        }

        // Random
        function randomSlide() {
            if (!hasSlides) return;
            var rand = Math.floor(Math.random() * imgTargets.length) + 1;
            showSlides(slideIndex = rand);
        }

        var randomFlag = 0;

        // The hourglass is pressed while autoplay runs, which also tilts it (see src/slideshow.css).
        function showAutoplay(on) {
            document.querySelector(".random button").setAttribute("aria-pressed", String(on));
        }

        function randomClick() {
            if (!hasSlides) return;
            if (randomFlag == 1) {
                int = self.setInterval(autoplayTick, 6000);
                showAutoplay(true);
                // Resuming autoplay replays the opening: the title card first, the notes on the next beat.
                setIntro(true);
                randomSlide();
                randomFlag = 0;
            } else {
                int = window.clearInterval(int);
                showAutoplay(false);
                setIntro(false);
                randomFlag = 1;
            }
        }

        // Screenshot overlay: one canvas at a time, shown with a class (see the markup) and dropped on close.
        var screenshotOverlay = document.getElementById("screenshot");
        var screenshotContent = document.getElementById("screenshot-content");

        function isScreenshotOpen() {
            return screenshotOverlay.classList.contains("is-open");
        }

        function setScreenshotOpen(open) {
            screenshotOverlay.classList.toggle("is-open", open);
            // While it is open the page behind it is inert, so Tab and the arrow keys stay with the overlay.
            Array.prototype.forEach.call(screenshotOverlay.parentElement.children, function(child) {
                if (child !== screenshotOverlay) child.inert = open;
            });
            if (open) {
                screenshotOverlay.querySelector(".save button").focus();
            } else {
                screenshotContent.replaceChildren();
                document.querySelector(".photo button").focus();
            }
        }

        function closeScreenshot() {
            if (isScreenshotOpen()) setScreenshotOpen(false);
        }

        function downloadCanvas() {
            var canvas = screenshotContent.querySelector("canvas");
            if (!canvas) return;
            canvas.toBlob(function(blob) {
                if (!blob) return;
                var link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "dynamix-" + Date.now() + ".png";
                document.body.append(link);
                link.click();
                link.remove();
                // The download reads the blob after the click returns; release it once that has had ample time.
                window.setTimeout(URL.revokeObjectURL.bind(URL, link.href), 40000);
            }, "image/png");
        }

        // Keyboard: Escape closes the screenshot overlay; the arrow keys turn the slides, but not while the overlay
        // is open or a form field has focus, and a held key does not race through the collection.
        document.addEventListener("keydown", function(event) {
            if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
            if (isScreenshotOpen()) {
                if (event.key === "Escape") closeScreenshot();
                return;
            }
            var step = event.key === "ArrowLeft" ? -1 : event.key === "ArrowRight" ? 1 : 0;
            if (!step || event.shiftKey || event.repeat) return;
            if (event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])")) return;
            event.preventDefault();
            plusSlides(step);
        });

        // The saved picture is drawn from a copy of the page (html2canvas, given `doc`), which draws a text cut by a line
        // clamp without its ellipsis. In that copy each cut text is shortened to the longest start that fits, ending in
        // a written ellipsis, so the picture never shows a silent cut.
        function markCuts(doc) {
            var view = doc.defaultView;
            doc.querySelectorAll(".slide-notes [data-full]").forEach(function(node) {
                if (!isCut(node, view)) return;
                var chars = Array.from(node.dataset.full);
                var shorten = function(length) { node.textContent = chars.slice(0, length).join("").trimEnd() + "…"; };
                var low = 0, high = chars.length - 1;
                while (low < high) {
                    var middle = Math.ceil((low + high) / 2);
                    shorten(middle);
                    if (isCut(node, view)) high = middle - 1;
                    else low = middle;
                }
                shorten(low);
            });
        }

        function screenshot() {
            var shouldHide = ["photo", "random", "github", "archive-link", "lang-toggle", "asset-caption", "signature", "prev", "next"];
            for (var i = 0; i < shouldHide.length; i++) document.getElementsByClassName(shouldHide[i])[0].style.visibility = 'hidden';

            var opt = {
                async: true,
                useCORS: true,
                onclone: markCuts
            };
            html2canvas(document.body, opt).then(function(canvas) {
                screenshotContent.replaceChildren(canvas);
                setScreenshotOpen(true);
            });

            for (var i = 0; i < shouldHide.length; i++) document.getElementsByClassName(shouldHide[i])[0].style.visibility = 'visible';
        }

    </script>
</body>

</html>
