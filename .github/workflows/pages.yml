            || fail "The release commit $SHA is not on main; only commits on main are released."
          echo "$REF names $SHA, also on origin, which is on main."
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements.txt
      - name: Stage the allowlisted website outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/pages"
          "$RUNNER_TEMP/venv/bin/python" -I scripts/prepare_pages.py --output "$RUNNER_TEMP/pages/site" \
            --summary "$RUNNER_TEMP/pages/summary.json" --manifest "$RUNNER_TEMP/pages/manifest.sha256"
          (cd "$RUNNER_TEMP/pages/site" && sha256sum --check --quiet --strict ../manifest.sha256)
          {
            echo "### Pages payload"
            echo '```json'
            cat "$RUNNER_TEMP/pages/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy
    needs: [approval, build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && needs.approval.outputs.commit == github.sha &&
      needs.approval.outputs.attempt == github.run_attempt &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published' &&
      toJSON(github.event.release.prerelease) == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
