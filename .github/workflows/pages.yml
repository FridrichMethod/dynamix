name: Deploy GitHub Pages (vX.Y.Z tags on main only)

# vX.Y.Z tags on main only. This workflow never runs on push, pull request or a schedule. A published GitHub Release
# that is not a prerelease, with a vX.Y.Z tag (three numbers without leading zeros: v1.10.0, not v01.1.0), deploys the
# commit of that tag, and a manual dispatch on such a tag (gh workflow run pages.yml --ref v1.1.1) redeploys it. Every
# run, a release run, a re-run of one and a dispatch alike, first looks up the tag's GitHub Release with one read-only
# API request in the approval job (and again in the build job) and deploys the tag's commit only if that Release is
# published and not a prerelease. A re-run keeps the event of the run it repeats, so only the lookup sees a Release that
# has since become a draft or a prerelease or been deleted. A re-run of the deploy job alone, or of any jobs without the
# approval job, repeats no lookup and deploys nothing, since the deploy job requires the approval job's record of the
# current attempt: re-run the whole run. A run takes this file from the tag's commit, so these rules apply to tags from
# v1.1.1 on: a run on an older tag would use that tag's own workflow, which does not check the Release, and the
# github-pages environment refuses its deployment. Every run also needs the tag to name the run's commit on origin too
# (read with git ls-remote, without credentials, as the checkout always has the tag at the run's commit), that commit to
# be on main, and the full Tests workflow to pass on it before the artifact is built. Any other run fails closed at the
# approval job (a dispatch on a branch, a tag that is not vX.Y.Z, a release that is a draft or prerelease, a tag without
# such a Release or whose lookup fails, a tag that origin now has on another commit, a commit that is not on main): no
# tests, no artifact, no deployment. The build job repeats the approval job's guards, and the deploy job deploys only
# the commit that the approval job of the same attempt recorded after all its guards passed. The github-pages
# environment accepts deployments only from tags from v1.1.1 on, and the repository ruleset "Release tags v*" lets only
# repository admins create, move or delete v* tags.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  approval:
    name: Release approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # Written by the last step only, after every guard passed. The deploy job requires them to be github.sha and its
      # own attempt (github.run_attempt): a re-run of the deploy job alone keeps the outputs of an earlier attempt,
      # whose lookup it does not repeat, and deploys nothing.
      commit: ${{ steps.approved.outputs.commit }}
      attempt: ${{ steps.approved.outputs.attempt }}
    steps:
      - name: Refuse unless a published vX.Y.Z release or a dispatch on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          TAG: ${{ github.event.release.tag_name }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$ACTION" = "published" ] || fail "Only a published release deploys, not a release that was $ACTION."
              [ "$DRAFT" = "false" ] || fail "Release $TAG has draft=$DRAFT; a draft never deploys."
              [ "$PRERELEASE" = "false" ] || fail "Release $TAG has prerelease=$PRERELEASE; a prerelease never deploys."
              [ "refs/tags/$TAG" = "$REF" ] || fail "The release names the tag $TAG, but the run is on $REF."
              ;;
            workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "Pages deploys only a vX.Y.Z tag (three numbers without leading zeros), not $REF."
          echo "$EVENT_NAME of $REF may deploy once its commit is on main and the tests pass."
      - name: Look up the GitHub Release of the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # The job's read-only token (contents: read), sent as a header from stdin, never on a command line.
          TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # A release run too: a re-run keeps the event of the run it repeats, so only this lookup sees the Release as
          # it is now (a draft, a prerelease or deleted since).
          case "$EVENT_NAME" in
            release | workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          tag="${REF#refs/tags/}"
          mkdir "$RUNNER_TEMP/release-lookup"
          # One read-only GET; this endpoint returns only a published Release. The guard below reads the response.
          status="$(printf 'Authorization: Bearer %s\n' "$TOKEN" | curl --silent --show-error --proto =https \
            --max-time 60 --header @- --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" --output "$RUNNER_TEMP/release-lookup/release.json" \
            --write-out "%{http_code}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")" \
            || fail "The lookup of the GitHub Release of $tag failed without a response; nothing is deployed."
          echo "$status" > "$RUNNER_TEMP/release-lookup/status"
          echo "The lookup of the GitHub Release of $tag returned HTTP $status."
      - name: Refuse unless the tag has a published GitHub Release that is not a prerelease
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release | workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          tag="${REF#refs/tags/}"
          lookup="$RUNNER_TEMP/release-lookup"
          [ -f "$lookup/status" ] || fail "No response of the lookup of the GitHub Release of $tag to check."
          status="$(cat "$lookup/status")"
          case "$status" in
            200)
              ;;
            404)
              fail "The tag $tag has no published GitHub Release (HTTP 404); only a released tag deploys."
              ;;
            *)
              fail "The lookup of the GitHub Release of $tag returned HTTP $status, not 200."
              ;;
          esac
          problem="$(jq --slurp --raw-output --arg tag "$tag" '
            if length != 1 then "is not one JSON object"
            elif (.[0] | type) != "object" then "is a JSON \(.[0] | type), not one object"
            elif .[0].tag_name != $tag then "names the tag \(.[0].tag_name | tojson), not \($tag)"
            elif .[0].draft != false then "has draft=\(.[0].draft | tojson); a draft never deploys"
            elif .[0].prerelease != false then "has prerelease=\(.[0].prerelease | tojson); a prerelease never deploys"
            else "" end' "$lookup/release.json")" \
            || fail "The lookup of the GitHub Release of $tag did not return valid JSON."
          [ -z "$problem" ] || fail "The GitHub Release found for $tag $problem."
          echo "The tag $tag has a published GitHub Release that is not a prerelease."
      - name: Checkout the tag with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unless the tag names the checked-out commit and it is on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          # git ls-remote reads the public repository without credentials; it must fail, not wait for a prompt.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The run's commit $SHA is not a full 40-character lowercase SHA."
          head="$(git rev-parse HEAD)" || fail "No Git checkout to compare with main."
          [ "$head" = "$SHA" ] || fail "Checked out $head, not the release commit $SHA."
          tagged="$(git rev-parse --verify --quiet "$REF^{commit}")" || fail "The tag $REF is not in the checkout."
          [ "$tagged" = "$SHA" ] || fail "The tag $REF names $tagged, not the release commit $SHA."
          # actions/checkout fetches the tag at the run's commit, so the checkout cannot show a tag moved since the run
          # started. The tag as origin has it now, peeled to its commit, must name the same commit.
          remote="$(git ls-remote origin "$REF" "$REF^{}")" || fail "The tag $REF could not be read from origin."
          named="" peeled=""
          while read -r object name; do
            case "$name" in
              "$REF") named="$object" ;;
              "$REF^{}") peeled="$object" ;;
            esac
          done <<< "$remote"
          [ "${peeled:-$named}" = "$SHA" ] \
            || fail "On origin the tag $REF names ${peeled:-${named:-no commit}}, not the release commit $SHA."
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null \
            || fail "origin/main is not in the checkout, so $SHA cannot be confirmed on main."
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main \
            || fail "The release commit $SHA is not on main; only commits on main are released."
          echo "$REF names $SHA, also on origin, which is on main."
      - name: Record the commit and the attempt that passed every guard
        id: approved
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    needs: approval
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build Pages artifact
    needs: [approval, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse unless a published vX.Y.Z release or a dispatch on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          TAG: ${{ github.event.release.tag_name }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$ACTION" = "published" ] || fail "Only a published release deploys, not a release that was $ACTION."
              [ "$DRAFT" = "false" ] || fail "Release $TAG has draft=$DRAFT; a draft never deploys."
              [ "$PRERELEASE" = "false" ] || fail "Release $TAG has prerelease=$PRERELEASE; a prerelease never deploys."
              [ "refs/tags/$TAG" = "$REF" ] || fail "The release names the tag $TAG, but the run is on $REF."
              ;;
            workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "Pages deploys only a vX.Y.Z tag (three numbers without leading zeros), not $REF."
          echo "$EVENT_NAME of $REF may deploy once its commit is on main and the tests pass."
      - name: Look up the GitHub Release of the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # The job's read-only token (contents: read), sent as a header from stdin, never on a command line.
          TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # A release run too: a re-run keeps the event of the run it repeats, so only this lookup sees the Release as
          # it is now (a draft, a prerelease or deleted since).
          case "$EVENT_NAME" in
            release | workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          tag="${REF#refs/tags/}"
          mkdir "$RUNNER_TEMP/release-lookup"
          # One read-only GET; this endpoint returns only a published Release. The guard below reads the response.
          status="$(printf 'Authorization: Bearer %s\n' "$TOKEN" | curl --silent --show-error --proto =https \
            --max-time 60 --header @- --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" --output "$RUNNER_TEMP/release-lookup/release.json" \
            --write-out "%{http_code}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")" \
            || fail "The lookup of the GitHub Release of $tag failed without a response; nothing is deployed."
          echo "$status" > "$RUNNER_TEMP/release-lookup/status"
          echo "The lookup of the GitHub Release of $tag returned HTTP $status."
      - name: Refuse unless the tag has a published GitHub Release that is not a prerelease
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release | workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          tag="${REF#refs/tags/}"
          lookup="$RUNNER_TEMP/release-lookup"
          [ -f "$lookup/status" ] || fail "No response of the lookup of the GitHub Release of $tag to check."
          status="$(cat "$lookup/status")"
          case "$status" in
            200)
              ;;
            404)
              fail "The tag $tag has no published GitHub Release (HTTP 404); only a released tag deploys."
              ;;
            *)
              fail "The lookup of the GitHub Release of $tag returned HTTP $status, not 200."
              ;;
          esac
          problem="$(jq --slurp --raw-output --arg tag "$tag" '
            if length != 1 then "is not one JSON object"
            elif (.[0] | type) != "object" then "is a JSON \(.[0] | type), not one object"
            elif .[0].tag_name != $tag then "names the tag \(.[0].tag_name | tojson), not \($tag)"
            elif .[0].draft != false then "has draft=\(.[0].draft | tojson); a draft never deploys"
            elif .[0].prerelease != false then "has prerelease=\(.[0].prerelease | tojson); a prerelease never deploys"
            else "" end' "$lookup/release.json")" \
            || fail "The lookup of the GitHub Release of $tag did not return valid JSON."
          [ -z "$problem" ] || fail "The GitHub Release found for $tag $problem."
          echo "The tag $tag has a published GitHub Release that is not a prerelease."
      - name: Checkout the tag with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unless the tag names the checked-out commit and it is on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          # git ls-remote reads the public repository without credentials; it must fail, not wait for a prompt.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The run's commit $SHA is not a full 40-character lowercase SHA."
          head="$(git rev-parse HEAD)" || fail "No Git checkout to compare with main."
          [ "$head" = "$SHA" ] || fail "Checked out $head, not the release commit $SHA."
          tagged="$(git rev-parse --verify --quiet "$REF^{commit}")" || fail "The tag $REF is not in the checkout."
          [ "$tagged" = "$SHA" ] || fail "The tag $REF names $tagged, not the release commit $SHA."
          # actions/checkout fetches the tag at the run's commit, so the checkout cannot show a tag moved since the run
          # started. The tag as origin has it now, peeled to its commit, must name the same commit.
          remote="$(git ls-remote origin "$REF" "$REF^{}")" || fail "The tag $REF could not be read from origin."
          named="" peeled=""
          while read -r object name; do
            case "$name" in
              "$REF") named="$object" ;;
              "$REF^{}") peeled="$object" ;;
            esac
          done <<< "$remote"
