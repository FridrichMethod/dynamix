name: Deploy GitHub Pages (vX.Y.Z tags on main only)

# vX.Y.Z tags on main only. This workflow never runs on push, pull request or a schedule. A published GitHub Release
# whose tag is vX.Y.Z (three numbers, not a prerelease) deploys the commit of that tag; a manual dispatch on such a tag
# deploys that commit (gh workflow run pages.yml --ref v1.1.0; a dispatch does not look up the tag's Release, so use it
# only to redeploy a released tag). Both need the tag's commit to be on main, and the full Tests workflow must pass on
# that commit before the artifact is built. Any other run fails closed at the approval job (a dispatch on a branch, a
# tag that is not vX.Y.Z, a release that is a draft or prerelease, a commit that is not on main): no tests, no artifact,
# no deployment. The build job repeats the approval job's guards, and the deploy job has its own condition. The
# github-pages environment must allow deployments from v* tags.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  approval:
    name: Release approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Refuse unless a published vX.Y.Z release or a dispatch on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          TAG: ${{ github.event.release.tag_name }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$ACTION" = "published" ] || fail "Only a published release deploys, not a release that was $ACTION."
              [ "$DRAFT" = "false" ] || fail "Release $TAG has draft=$DRAFT; a draft never deploys."
              [ "$PRERELEASE" = "false" ] || fail "Release $TAG has prerelease=$PRERELEASE; a prerelease never deploys."
              [ "refs/tags/$TAG" = "$REF" ] || fail "The release names the tag $TAG, but the run is on $REF."
              ;;
            workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Pages deploys only a vX.Y.Z tag, not $REF."
          echo "$EVENT_NAME of $REF may deploy once its commit is on main and the tests pass."
      - name: Checkout the tag with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unless the tag names the checked-out commit and it is on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The run's commit $SHA is not a full 40-character lowercase SHA."
          head="$(git rev-parse HEAD)" || fail "No Git checkout to compare with main."
          [ "$head" = "$SHA" ] || fail "Checked out $head, not the release commit $SHA."
          tagged="$(git rev-parse --verify --quiet "$REF^{commit}")" || fail "The tag $REF is not in the checkout."
          [ "$tagged" = "$SHA" ] || fail "The tag $REF names $tagged, not the release commit $SHA."
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null \
            || fail "origin/main is not in the checkout, so $SHA cannot be confirmed on main."
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main \
            || fail "The release commit $SHA is not on main; only commits on main are released."
          echo "$REF names $SHA, which is on main."

  tests:
    name: Tests
    needs: approval
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build Pages artifact
    needs: [approval, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse unless a published vX.Y.Z release or a dispatch on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          TAG: ${{ github.event.release.tag_name }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$ACTION" = "published" ] || fail "Only a published release deploys, not a release that was $ACTION."
              [ "$DRAFT" = "false" ] || fail "Release $TAG has draft=$DRAFT; a draft never deploys."
              [ "$PRERELEASE" = "false" ] || fail "Release $TAG has prerelease=$PRERELEASE; a prerelease never deploys."
              [ "refs/tags/$TAG" = "$REF" ] || fail "The release names the tag $TAG, but the run is on $REF."
              ;;
            workflow_dispatch)
              ;;
            *)
              fail "Pages deploys only from a published release or a dispatch on a vX.Y.Z tag, not $EVENT_NAME."
              ;;
          esac
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Pages deploys only a vX.Y.Z tag, not $REF."
          echo "$EVENT_NAME of $REF may deploy once its commit is on main and the tests pass."
      - name: Checkout the tag with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unless the tag names the checked-out commit and it is on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The run's commit $SHA is not a full 40-character lowercase SHA."
          head="$(git rev-parse HEAD)" || fail "No Git checkout to compare with main."
          [ "$head" = "$SHA" ] || fail "Checked out $head, not the release commit $SHA."
          tagged="$(git rev-parse --verify --quiet "$REF^{commit}")" || fail "The tag $REF is not in the checkout."
          [ "$tagged" = "$SHA" ] || fail "The tag $REF names $tagged, not the release commit $SHA."
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null \
            || fail "origin/main is not in the checkout, so $SHA cannot be confirmed on main."
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main \
            || fail "The release commit $SHA is not on main; only commits on main are released."
          echo "$REF names $SHA, which is on main."
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements.txt
      - name: Stage the allowlisted website outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/pages"
          "$RUNNER_TEMP/venv/bin/python" -I scripts/prepare_pages.py --output "$RUNNER_TEMP/pages/site" \
            --summary "$RUNNER_TEMP/pages/summary.json" --manifest "$RUNNER_TEMP/pages/manifest.sha256"
          (cd "$RUNNER_TEMP/pages/site" && sha256sum --check --quiet --strict ../manifest.sha256)
          {
            echo "### Pages payload"
            echo '```json'
            cat "$RUNNER_TEMP/pages/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published' &&
      github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
