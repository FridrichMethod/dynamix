name: Check sources (manual, read-only)

# Manual only and read-only during the release hold: compares live wiki metadata (no file downloads) with the
# committed discovery snapshots and uploads the report as a run artifact. It never commits, pushes, creates branches
# or pull requests, or changes data, and it has no schedule. Reviewing the report and refreshing snapshots or
# downloads happen locally through the fetchers and an ordinary reviewed commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-sources
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  report:
    name: Source metadata report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements.txt
      - name: Compare live metadata with the saved snapshots
        # check_sources.py exits 3 after writing the report when a live check was incomplete (blocked, timed out,
        # API error, unreadable entry, page limit): the report is still published, and the step then fails.
        run: |
          mkdir "$RUNNER_TEMP/source-check"
          status=0
          "$RUNNER_TEMP/venv/bin/python" -I scripts/check_sources.py --report "$RUNNER_TEMP/source-check/report.md" \
            --summary "$RUNNER_TEMP/source-check/summary.json" || status=$?
          if [ -f "$RUNNER_TEMP/source-check/report.md" ]; then
            cat "$RUNNER_TEMP/source-check/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$status" in
            0) echo "Every checked source was listed completely; differences, if any, are in the report." ;;
            3) echo "::error::Live source check incomplete (blocked, failed or cut short); see the report."
               exit 3 ;;
            *) echo "::error::check_sources.py failed with exit status $status."
               exit "$status" ;;
          esac
      - name: The checkout is unchanged
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          [ -z "$changes" ] || { echo "::error::the source check modified the checkout"; printf '%s\n' "$changes"; exit 1; }
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-check-report
          path: ${{ runner.temp }}/source-check
          if-no-files-found: warn
          retention-days: 30
